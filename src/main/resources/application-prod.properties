# Production profile overrides.
# Activated ONLY when SPRING_PROFILES_ACTIVE=prod is set (Spring Boot then loads
# this file in addition to application.properties, with these values taking precedence).
#
# This file intentionally contains no secrets. Database credentials and other
# environment-specific values must still come from environment variables.

# --- Hardening: silence Hibernate SQL logging in production ---
spring.jpa.show-sql=false

# --- Hardening: disable Swagger/OpenAPI in production ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Aiven for MySQL: TLS is mandatory ---
# The base datasource URL in application.properties has no SSL parameters so
# local development (XAMPP MariaDB) keeps working. Aiven for MySQL requires an
# encrypted connection, so the prod URL demands TLS explicitly.
# sslMode=REQUIRED is supported by mysql-connector-j 8.0.13+ (used by this app).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED

# Aiven is MySQL, not MariaDB: use Hibernate's MySQL dialect for schema
# validation (the base config sets MariaDBDialect for local development).
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# NOTE: spring.jpa.hibernate.ddl-auto is intentionally NOT set here; it inherits
# "validate" from application.properties (Flyway owns the schema).
