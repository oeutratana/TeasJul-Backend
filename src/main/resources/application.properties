spring.application.name=rental_management

server.port=8082

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.flyway.out-of-order=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:${JWT_EXPIRATION:900000}}

payway.merchant-id=${PAYWAY_MERCHANT_ID:}
payway.api-key=${PAYWAY_API_KEY:}
payway.base-url=${PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
payway.callback-url=${PAYWAY_CALLBACK_URL:}

# --- Telegram bot (credentials MUST come from environment; never hardcoded) ---
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

# --- Mail (credentials MUST come from environment; never hardcoded) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@teasjul.local}
app.mail.enabled=${MAIL_ENABLED:false}

# --- Account security / OTP / 2FA ---
# OTP lifetime in milliseconds
app.security.otp-ttl=${APP_SECURITY_OTP_TTL:300000}
app.security.otp-max-attempts=${APP_SECURITY_OTP_MAX_ATTEMPTS:5}
app.security.otp-resend-cooldown=${APP_SECURITY_OTP_RESEND_COOLDOWN:60000}
app.security.otp-max-sends-per-window=${APP_SECURITY_OTP_MAX_SENDS_PER_WINDOW:5}
app.security.otp-send-window=${APP_SECURITY_OTP_SEND_WINDOW:900000}
app.security.max-requests-per-ip=${APP_SECURITY_MAX_REQUESTS_PER_IP:10}
app.security.rate-limit-window=${APP_SECURITY_RATE_LIMIT_WINDOW:900000}
# Comma-separated role codes that always require 2FA
app.security.two-factor-required-roles=${APP_SECURITY_TWO_FACTOR_REQUIRED_ROLES:}
app.security.reset-token-ttl=${APP_SECURITY_RESET_TOKEN_TTL:300000}
app.security.challenge-token-ttl=${APP_SECURITY_CHALLENGE_TOKEN_TTL:300000}

# --- API rate limiting (token buckets via bucket4j; bounded in-memory storage) ---
# Master switch for the filter-level limiter
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
# Bounded cache for buckets: hard caps so memory can never grow unbound
app.ratelimit.store.max-buckets=${RATE_LIMIT_MAX_BUCKETS:100000}
app.ratelimit.store.bucket-idle=${RATE_LIMIT_BUCKET_IDLE:30m}
app.ratelimit.store.bucket-max-life=${RATE_LIMIT_BUCKET_MAX_LIFE:1h}
# Trust X-Forwarded-For ONLY behind a strict reverse proxy that overwrites it,
# otherwise clients can spoof their IP to smear/evade the limiter.
app.ratelimit.proxy.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
# Per-policy overrides (optional), keyed by RateLimitPolicy enum name.
# e.g. app.ratelimit.policies.AUTH_LOGIN_ACCOUNT.capacity=10
#      app.ratelimit.policies.AUTH_LOGIN_ACCOUNT.refill-period=10m
#      app.ratelimit.policies.AUTH_LOGIN_ACCOUNT.fail-closed=true
app.ratelimit.policies.AUTH_LOGIN_IP.capacity=${RATE_LIMIT_AUTH_LOGIN_IP_CAPACITY:20}
app.ratelimit.policies.AUTH_LOGIN_IP.refill-period=${RATE_LIMIT_AUTH_LOGIN_IP_PERIOD:15m}
app.ratelimit.policies.AUTH_LOGIN_ACCOUNT.capacity=${RATE_LIMIT_AUTH_LOGIN_ACCOUNT_CAPACITY:5}
app.ratelimit.policies.AUTH_LOGIN_ACCOUNT.refill-period=${RATE_LIMIT_AUTH_LOGIN_ACCOUNT_PERIOD:15m}
app.ratelimit.policies.AUTH_REGISTER_IP.capacity=${RATE_LIMIT_AUTH_REGISTER_IP_CAPACITY:10}
app.ratelimit.policies.AUTH_REGISTER_IP.refill-period=${RATE_LIMIT_AUTH_REGISTER_IP_PERIOD:1h}
app.ratelimit.policies.AUTH_OTP_IP.capacity=${RATE_LIMIT_AUTH_OTP_IP_CAPACITY:30}
app.ratelimit.policies.AUTH_OTP_IP.refill-period=${RATE_LIMIT_AUTH_OTP_IP_PERIOD:15m}
app.ratelimit.policies.AUTH_OTP_ACCOUNT.capacity=${RATE_LIMIT_AUTH_OTP_ACCOUNT_CAPACITY:8}
app.ratelimit.policies.AUTH_OTP_ACCOUNT.refill-period=${RATE_LIMIT_AUTH_OTP_ACCOUNT_PERIOD:15m}
app.ratelimit.policies.AUTH_PASSWORD_RESET_IP.capacity=${RATE_LIMIT_AUTH_PASSWORD_RESET_IP_CAPACITY:10}
app.ratelimit.policies.AUTH_PASSWORD_RESET_IP.refill-period=${RATE_LIMIT_AUTH_PASSWORD_RESET_IP_PERIOD:15m}
app.ratelimit.policies.AUTH_PASSWORD_RESET_ACCOUNT.capacity=${RATE_LIMIT_AUTH_PASSWORD_RESET_ACCOUNT_CAPACITY:5}
app.ratelimit.policies.AUTH_PASSWORD_RESET_ACCOUNT.refill-period=${RATE_LIMIT_AUTH_PASSWORD_RESET_ACCOUNT_PERIOD:15m}
app.ratelimit.policies.AUTH_2FA_IP.capacity=${RATE_LIMIT_AUTH_2FA_IP_CAPACITY:20}
app.ratelimit.policies.AUTH_2FA_IP.refill-period=${RATE_LIMIT_AUTH_2FA_IP_PERIOD:15m}
app.ratelimit.policies.AUTH_2FA_ACCOUNT.capacity=${RATE_LIMIT_AUTH_2FA_ACCOUNT_CAPACITY:8}
app.ratelimit.policies.AUTH_2FA_ACCOUNT.refill-period=${RATE_LIMIT_AUTH_2FA_ACCOUNT_PERIOD:15m}
app.ratelimit.policies.PUBLIC_READ.capacity=${RATE_LIMIT_PUBLIC_READ_CAPACITY:120}
app.ratelimit.policies.PUBLIC_READ.refill-period=${RATE_LIMIT_PUBLIC_READ_PERIOD:1m}
app.ratelimit.policies.PUBLIC_DETAIL.capacity=${RATE_LIMIT_PUBLIC_DETAIL_CAPACITY:60}
app.ratelimit.policies.PUBLIC_DETAIL.refill-period=${RATE_LIMIT_PUBLIC_DETAIL_PERIOD:1m}
app.ratelimit.policies.PUBLIC_CONTACT.capacity=${RATE_LIMIT_PUBLIC_CONTACT_CAPACITY:10}
app.ratelimit.policies.PUBLIC_CONTACT.refill-period=${RATE_LIMIT_PUBLIC_CONTACT_PERIOD:1h}
app.ratelimit.policies.AUTHENTICATED_API_IP.capacity=${RATE_LIMIT_AUTHENTICATED_API_IP_CAPACITY:1200}
app.ratelimit.policies.AUTHENTICATED_API_IP.refill-period=${RATE_LIMIT_AUTHENTICATED_API_IP_PERIOD:1m}
app.ratelimit.policies.AUTHENTICATED_API_USER.capacity=${RATE_LIMIT_AUTHENTICATED_API_USER_CAPACITY:600}
app.ratelimit.policies.AUTHENTICATED_API_USER.refill-period=${RATE_LIMIT_AUTHENTICATED_API_USER_PERIOD:1m}
app.ratelimit.policies.SENSITIVE_WRITE_USER.capacity=${RATE_LIMIT_SENSITIVE_WRITE_USER_CAPACITY:30}
app.ratelimit.policies.SENSITIVE_WRITE_USER.refill-period=${RATE_LIMIT_SENSITIVE_WRITE_USER_PERIOD:1m}
app.ratelimit.policies.PAYMENT_CALLBACK.capacity=${RATE_LIMIT_PAYMENT_CALLBACK_CAPACITY:120}
app.ratelimit.policies.PAYMENT_CALLBACK.refill-period=${RATE_LIMIT_PAYMENT_CALLBACK_PERIOD:1m}

# --- Cloudinary image hosting (credentials MUST come from environment; never hardcoded) ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- Multipart upload limits ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# --- AI Assistant ---
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:openrouter}
app.ai.model=${AI_MODEL:}
app.ai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:180}
app.ai.max-tool-calls=${AI_MAX_TOOL_CALLS:6}
app.ai.history-messages=${AI_HISTORY_MESSAGES:12}
